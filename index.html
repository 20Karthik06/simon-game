<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simons Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Says Game</h1>
    <h2>Start the Game</h2>
    <div class="container">
        <div class="cont1">
            <div class="box green" id="green">1</div>
            <div class="box yellow"  id="yellow">2</div>
        </div>
        <div class="cont2">
            <div class="box orange"  id="orange">3</div>
            <div class="box purple"  id="purple">4</div>
        </div>
        
    </div>
    <script src="app.js"></script>
</body>
</html>
